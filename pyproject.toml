[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ghidrama"
version = "0.1.0"
description = "A local Ghidra reverse engineering workbench with an MCP-driven LLM analyst"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "pydantic>=2.10,<3",
  "pefile>=2024.8.26",
  "pyghidra==3.1.0",
  "mcp>=1.20,<2",
  "langgraph>=1,<2",
  "httpx>=0.28,<1",
  "cryptography>=44",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
